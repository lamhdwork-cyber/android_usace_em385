<h1>02.H&nbsp;&nbsp;Changing Rooms</h1>
<p>02.H&nbsp;&nbsp;Changing Rooms. Whenever employees are required by a particular standard to wear protective clothing, changing rooms shall be equipped with separate storage facilities for both street clothes and protective clothing.</p>
