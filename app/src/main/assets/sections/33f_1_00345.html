<h1><new>33</new>.F&nbsp;&nbsp;</h1>
<p><new>33</new>.F&nbsp;&nbsp;RCRA TSD Facilities. Requirements specified in 29 CFR 1910.120 and 29 CFR 1926.65(p), and the terms of the facility RCRA permit shall be complied with for operations at TSD facilities.</p>
